name: CI

# ROADMAP.v5.md Part J, "real budgets in CI": before this workflow, there was no CI at all in this
# repo (confirmed: no .github/workflows directory existed) - `npm run build`'s gzip budget checks and
# LaughTale.Tests only ever ran if a developer happened to run them by hand. This runs both on every
# push/PR so a regression is caught before merge, not discovered by chance months later.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # LaughTale.Showcase, LaughTale.Showcase.Islands, and LaughTale.Docs each run their own npm
      # build (`BuildIslandsJs`/`LaughTale.Generators.targets` MSBuild targets: esbuild bundling, and
      # for Islands, the `laughtale islands build` CLI) as a pre-build step - `dotnet build` shells
      # out to `npm run build`/`npx` in each project's own directory, so their npm dependencies must
      # already exist before the solution build below, or every one of these three projects fails with
      # `Cannot find package 'esbuild'` (confirmed: this was the actual, previously-undiscovered reason
      # every CI run on this repo has failed since the workflow was first created - no job ever ran
      # `npm ci` anywhere but LaughTale.Client). LaughTale.Client must be installed first:
      # Showcase.Islands' own package.json depends on it via `"laughtale": "file:../LaughTale.Client"`,
      # and the island-compiler CLI's own scripts (esbuild included) resolve modules from
      # LaughTale.Client's node_modules, not Islands' own (confirmed empirically).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            LaughTale.Client/package-lock.json
            LaughTale.Showcase.Islands/package-lock.json
            LaughTale.Showcase/package-lock.json
            LaughTale.Docs/package-lock.json

      - name: Install npm dependencies (Client)
        working-directory: LaughTale.Client
        run: npm ci

      - name: Install npm dependencies (Showcase.Islands)
        working-directory: LaughTale.Showcase.Islands
        run: npm ci

      - name: Install npm dependencies (Showcase)
        working-directory: LaughTale.Showcase
        run: npm ci

      - name: Install npm dependencies (Docs)
        working-directory: LaughTale.Docs
        run: npm ci

      - name: Restore
        run: dotnet restore LaughTale.slnx

      - name: Build
        run: dotnet build LaughTale.slnx --no-restore -c Release

      - name: Test
        run: dotnet test LaughTale.Tests/LaughTale.Tests.csproj --no-build -c Release

  client:
    name: Client build, tests & perf budgets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LaughTale.Client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: LaughTale.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify (contract lint, metrics, unit tests)
        run: npm run verify

      - name: Production build (typecheck + whole-bundle and per-island gzip budgets)
        run: npm run build

  e2e:
    name: Playwright e2e (functional + visual regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            LaughTale.Client/package-lock.json
            LaughTale.Showcase.Islands/package-lock.json
            LaughTale.Showcase/package-lock.json

      # LaughTale.Client must be installed first: LaughTale.Showcase.Islands' own package.json
      # depends on it via `"laughtale": "file:../LaughTale.Client"`, and the island-compiler CLI's
      # own scripts (esbuild included) resolve modules from LaughTale.Client's node_modules, not
      # Islands' own - both must exist before building Showcase below (see the `dotnet` job above
      # for the full explanation of why this order matters).
      - name: Install npm dependencies (Client)
        working-directory: LaughTale.Client
        run: npm ci

      - name: Install npm dependencies (Showcase.Islands)
        working-directory: LaughTale.Showcase.Islands
        run: npm ci

      - name: Install npm dependencies (Showcase)
        working-directory: LaughTale.Showcase
        run: npm ci

      # Debug config (no `-c Release`), matching webServer.command's own implicit `dotnet run`
      # default - so this prebuild is actually reused instead of mismatching configs and rebuilding.
      - name: Build Showcase (same config webServer.command itself uses)
        run: dotnet build LaughTale.Showcase/LaughTale.Showcase.csproj

      # All 3 engines, not chromium-only: this job also runs the pre-existing functional specs
      # cross-browser for the first time ever in CI (see ROADMAP.v5.md Part C).
      - name: Install Playwright browsers
        working-directory: LaughTale.Client
        run: npx playwright install --with-deps

      - name: Run Playwright tests (3 existing functional specs cross-browser + visual project chromium-only)
        working-directory: LaughTale.Client
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: LaughTale.Client/playwright-report/
          retention-days: 14
