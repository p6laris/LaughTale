name: LaughTale CI

on:
  push:
    branches: [ main, master, comp ]
  pull_request:
    branches: [ main, master, comp ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'LaughTale.Client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: ./LaughTale.Client
        run: npm ci

      - name: Verify Contract Linting
        working-directory: ./LaughTale.Client
        run: npm run lint:contracts

      - name: Audit Metrics Ratchet
        working-directory: ./LaughTale.Client
        run: npm run lint:metrics

      - name: Audit Server Security
        run: node scripts/audit-server-security.mjs

      - name: TypeScript Typecheck
        working-directory: ./LaughTale.Client
        run: npm run typecheck

      - name: Build Client Bundle
        working-directory: ./LaughTale.Client
        run: npm run build

      - name: Run Client Test Suites
        working-directory: ./LaughTale.Client
        run: npm test

      - name: Restore .NET Solution
        run: dotnet restore LaughTale.slnx

      - name: Build .NET Solution
        run: dotnet build LaughTale.slnx --no-restore -c Release

      - name: Run .NET Test Suites
        run: dotnet test LaughTale.slnx --no-build -c Release --verbosity normal

      - name: Pack NuGet Packages
        run: |
          dotnet pack LaughTale.Core/LaughTale.Core.csproj -c Release -o ./artifacts
          dotnet pack LaughTale.Components/LaughTale.Components.csproj -c Release -o ./artifacts
          dotnet pack LaughTale.Generators/LaughTale.Generators.csproj -c Release -o ./artifacts
          dotnet pack LaughTale.Templates/LaughTale.Templates.csproj -c Release -o ./artifacts
          dotnet pack LaughTale.Cli/LaughTale.Cli.csproj -c Release -o ./artifacts
